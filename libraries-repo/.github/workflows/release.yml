name: Publier les bibliothèques

# Pousser une étiquette « v1.0.0 » construit index.json et les fichiers .bkl, puis crée la release GitHub.
# Le Studio lit  https://github.com/berkiosbuinu-server/berkios-code/releases/latest/download/index.json
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-release.mjs
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "Bibliothèques ${{ github.ref_name }}" --generate-notes
